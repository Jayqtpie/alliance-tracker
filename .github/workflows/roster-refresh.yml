# Twice-weekly RSCL roster refresh with Claude Code on the owner's Claude subscription.
# A probe decides whether Claude runs at all and from which source (LastRank, or lwservers as
# the backup when LastRank is stale); Claude (Opus, with a Sonnet subagent collecting from
# LastRank) builds and commits; this workflow re-verifies and pushes: LastRank refreshes to main,
# which deploys to production, and lwservers refreshes to a review branch the owner merges by hand.
name: Roster refresh

on:
  schedule:
    # Sundays and Wednesdays 04:52 UTC = 05:52 BST (04:52 GMT once the clocks go back in late
    # October). Off the hour because GitHub delays scheduled runs under load, worst at :00, and
    # can drop them outright: the 04:00 slot never fired on 2026-09-27.
    - cron: "52 4 * * 0,3"
  workflow_dispatch:

concurrency:
  group: roster-refresh
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # No stored credentials: Claude's step cannot push. Only the final step can.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Probe LastRank (and the lwservers backup) for changes
        id: probe
        run: node .claude/skills/rscl-roster-refresh/scripts/probe.mjs | tee "$RUNNER_TEMP/probe.json"

      - name: Install dependencies
        if: steps.probe.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund
      - name: Install Claude Code
        if: steps.probe.outputs.changed == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Refresh with Claude
        id: claude
        if: steps.probe.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          prompt="$(cat .claude/skills/rscl-roster-refresh/cron-prompt.md)

          Probe result: $(cat "$RUNNER_TEMP/probe.json")"
          status=0
          started=$(date +%s)
          claude -p "$prompt" --model claude-opus-5-5 --effort medium --max-budget-usd 8 \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Agent" \
            --disallowedTools "Bash(git push:*)" \
            --output-format json > "$RUNNER_TEMP/claude.json" || status=$?
          # Counts only: the result text and the transcript stay off the public log. Wall time is
          # measured here: on the first run the result's duration_ms said 2 minutes for a 23-minute step.
          node -e 'const r = require(process.argv[1]); console.log(JSON.stringify({ subtype: r.subtype, isError: r.is_error, turns: r.num_turns, costUsd: r.total_cost_usd, wallMinutes: Math.round(Number(process.argv[2]) / 60) }))' "$RUNNER_TEMP/claude.json" "$(( $(date +%s) - started ))" || true
          exit $status
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Viewer passcode for live-state.mjs; viewer access is read-only.
          TRACKER_PASSCODE: ${{ secrets.TRACKER_PASSCODE }}

      # Trust nothing Claude reported: re-check the commit's shape and every gate, then push.
      - name: Verify and push
        if: steps.probe.outputs.changed == 'true'
        run: |
          before="${{ steps.claude.outputs.before }}"
          if [ "$(git rev-parse HEAD)" = "$before" ]; then echo "No commit: nothing to push."; exit 0; fi
          unexpected=$(git diff --name-only "$before" HEAD | grep -v -E '^(lib/data/rscl-roster-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json|public/avatars/rscl/[^/]+|lib/roster-import\.ts|lib/[a-z-]+\.test\.ts)$' || true)
          if [ -n "$unexpected" ]; then echo "Commit touches files a refresh should not:"; echo "$unexpected"; exit 1; fi
          git diff --name-only --diff-filter=A "$before" HEAD | grep -q -E '^lib/data/rscl-roster-' || { echo "No new roster export in the commit."; exit 1; }
          git diff "$before" HEAD -- lib/roster-import.ts | grep -q '^+export const ROSTER_IMPORT' || { echo "ROSTER_IMPORT marker was not bumped."; exit 1; }
          npx tsc --noEmit
          npx eslint .
          npx vitest run
          # Either source's staging directory; a fresh runner holds only this run's.
          live=$(ls -t .data/*-refresh-*/live-before.json | head -n 1)
          LIVE_STATE="$live" npx vitest run --config .claude/skills/rscl-roster-refresh/scripts/vitest.apply.config.mts
          # A backup-source (lwservers) refresh never deploys itself: it waits on a review branch
          # until the owner merges it. Only LastRank refreshes go straight to main.
          if [ "$SOURCE" = "lwservers" ]; then
            branch="roster-refresh/lwservers-$(date -u +%F)"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
            echo "Pushed to $branch for review; main is unchanged."
            exit 0
          fi
          # Fast-forward only: if main moved during the run this fails rather than overwrite it.
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ steps.probe.outputs.source }}
